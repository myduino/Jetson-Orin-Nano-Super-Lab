<!doctype html><html><head><meta charset="utf-8"><title>Myduino Jetson Lab</title>
<style>
body{font-family:system-ui,Segoe UI,sans-serif;margin:0;background:#14213d;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;gap:14px;user-select:none}
h1{font-size:20px;margin:0} #status{font-size:14px;opacity:.85;min-height:18px;text-align:center;padding:0 16px}
.row{display:flex;gap:14px}
button{font:inherit;font-size:16px;font-weight:600;padding:14px 26px;border-radius:10px;border:0;cursor:pointer}
#go{background:#2ec27e;color:#06260f} #stop{background:#e5484d;color:#fff} #pt{background:transparent;color:#fff;border:1px solid #fff6;font-size:13px;font-weight:400;padding:6px 12px}
button:disabled{opacity:.35;cursor:default}
small{opacity:.6;font-size:12px;text-align:center;padding:0 12px}
</style></head><body>
<h1>Myduino Jetson Lab</h1>
<div class="row"><button id="go">START LAB</button><button id="stop">END LAB</button></div>
<button id="pt">Open teacher portal</button>
<div id="status"></div><small id="info"></small>
<script>
const $ = id => document.getElementById(id);
let busy = false;
async function paint(){
  const s = await lab.state();
  $('go').disabled = busy || s.open; $('stop').disabled = busy || !s.open; $('pt').disabled = !s.open;
  if (!busy) $('status').textContent = s.open ? `Lab is open. ${s.running} student session(s) running on ${s.online} Jetson(s).` : (s.running ? `Closing... ${s.running} session(s) still stopping.` : 'Lab is closed. Students cannot open Jupyter.');
  $('info').textContent = `Class key ${s.key}   |   this PC ${s.ip}:${s.port}`;
}
$('go').onclick = async () => { busy = true; $('status').textContent = 'Starting...'; $('go').disabled = true; const r = await lab.start(); busy = false; if (r && r.error) $('status').textContent = r.error; paint(); };
$('stop').onclick = async () => { busy = true; $('stop').disabled = true; $('status').textContent = 'Closing the lab...'; const r = await lab.end(); busy = false; if (r && r.cancelled) {} paint(); };
$('pt').onclick = () => lab.portal();
paint(); setInterval(paint, 2000);
</script></body></html>
